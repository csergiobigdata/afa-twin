# Configuração de deploy do frontend (estático) no Netlify (camada gratuita).
#
# IMPORTANT: troque "https://SUBSTITUA-PELA-URL-DO-BACKEND.vercel.app" abaixo
# pela URL real do backend depois de publicá-lo (no Vercel) - ver
# docs/06-implantacao-nuvem.md. Sem isso, as chamadas a /api não encontrarão
# a API. Isso só é necessário para um deploy manual pelo dashboard do Netlify
# (conectando o repositório Git); o deploy automatizado
# (tools/deploy_cloud.py) gera esse mesmo redirecionamento dinamicamente em
# frontend/dist/_redirects, já com a URL correta.

[build]
  command = "npm run build"
  publish = "dist"

# Encaminha chamadas de API (inclui /api/media/<id>, fotos) para o backend
# publicado, mantendo o frontend chamando caminhos relativos ("/api/...")
# como já faz em desenvolvimento - sem precisar reescrever nenhum código do
# cliente HTTP.
[[redirects]]
  from = "/api/*"
  to = "https://SUBSTITUA-PELA-URL-DO-BACKEND.vercel.app/api/:splat"
  status = 200
  force = true

# Roteamento client-side (React Router) — qualquer outra rota cai no index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
