<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1f44" />
    <meta name="description" content="AFA-TWIN - Gêmeo Digital para gerenciamento e controle de manutenção de aeronaves militares (piloto de testes FAB / ITA / Embraer)." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <title>AFA-TWIN · Manutenção Aeronáutica</title>
    <script>
      // Aplica o modo dia/noturno salvo (ver src/theme/ThemeContext.tsx)
      // ANTES da primeira renderização, evitando o "flash" de um tema
      // trocando para o outro assim que o React monta. Padrão "dark" (modo
      // noturno) quando não há preferência salva, reproduzindo a aparência
      // histórica do app em vez de seguir o tema do sistema operacional.
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("afa_twin_theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (e) { /* ambientes sem localStorage (ex.: modo privado) */ }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
