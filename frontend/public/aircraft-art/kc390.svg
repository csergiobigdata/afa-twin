<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260">
  <defs>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f6fb"/><stop offset="100%" stop-color="#dbe1ec"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6e9f0"/><stop offset="100%" stop-color="#b8c0d2"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcc29"/><stop offset="100%" stop-color="#0b7a3f"/>
    </linearGradient>
  </defs>
  <rect width="480" height="260" fill="url(#mat)"/>
  <rect x="7" y="7" width="466" height="246" rx="6" fill="none" stroke="#c7cedd" stroke-width="2.5"/>
  <ellipse cx="240" cy="200" rx="150" ry="9" fill="#0a1f44" opacity="0.14"/>

  <!-- asa alta -->
  <path d="M150,110 L360,110 L360,120 L150,120 Z" fill="#c3cad8" stroke="#0a1f44" stroke-width="1.8"/>
  <!-- nacelles dos motores (pod sob a asa) -->
  <rect x="188" y="122" width="46" height="20" rx="9" fill="#8a97ac" stroke="#0a1f44" stroke-width="1.4"/>
  <rect x="282" y="122" width="46" height="20" rx="9" fill="#8a97ac" stroke="#0a1f44" stroke-width="1.4"/>

  <!-- cauda em T: deriva alta + estabilizador no topo -->
  <path d="M366,108 C376,80 396,68 410,72 L416,150 C398,138 376,128 366,108 Z" fill="#173b74" stroke="#0a1f44" stroke-width="1.8"/>
  <path d="M378,86 L392,82 L402,104 L388,108 Z" fill="url(#stripe)"/>
  <rect x="392" y="66" width="30" height="9" rx="4" fill="url(#body)" stroke="#0a1f44" stroke-width="1.5"/>
  <circle cx="372" cy="122" r="7" fill="#0b7a3f"/><circle cx="372" cy="122" r="4.3" fill="#ffcc29"/><circle cx="372" cy="122" r="2.2" fill="#1c4f9c"/>

  <!-- fuselagem -->
  <path d="M70,140 C90,124 130,114 180,111 C260,107 350,112 408,132
           C424,137 434,142 439,146 C432,151 412,157 380,162
           C310,172 190,177 132,171 C92,167 82,156 70,140 Z"
        fill="url(#body)" stroke="#0a1f44" stroke-width="1.8"/>

  <!-- cockpit (linha simples, sem bolha - fuselagem tipo jato de transporte) -->
  <path d="M78,132 L110,124 L112,132 L82,140 Z" fill="#141b24" opacity="0.85"/>

  <text x="240" y="234" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0a1f44">FAB 2856 · Embraer KC-390 Millennium</text>
  <text x="240" y="249" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#4b5566">Ilustração vetorial de perfil (ilustrativo)</text>
</svg>
