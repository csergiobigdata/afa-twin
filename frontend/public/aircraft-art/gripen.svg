<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260">
  <defs>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f6fb"/><stop offset="100%" stop-color="#dbe1ec"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c7cfdc"/><stop offset="100%" stop-color="#98a4bc"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcc29"/><stop offset="100%" stop-color="#0b7a3f"/>
    </linearGradient>
  </defs>
  <rect width="480" height="260" fill="url(#mat)"/>
  <rect x="7" y="7" width="466" height="246" rx="6" fill="none" stroke="#c7cedd" stroke-width="2.5"/>
  <ellipse cx="240" cy="200" rx="150" ry="9" fill="#0a1f44" opacity="0.14"/>

  <!-- asa delta (bem larga, characterística do Gripen) -->
  <path d="M190,164 L306,164 L348,208 L330,212 L246,178 L162,212 L146,208 Z" fill="#8a97ac" stroke="#0a1f44" stroke-width="1.8"/>

  <!-- estabilizador horizontal -->
  <path d="M372,146 L412,152 L376,160 Z" fill="url(#body)" stroke="#0a1f44" stroke-width="1.8"/>

  <!-- deriva única, alta e reta -->
  <path d="M356,122 C366,92 386,80 402,84 L408,152 C391,143 368,138 356,122 Z" fill="#173b74" stroke="#0a1f44" stroke-width="1.8"/>
  <path d="M370,96 L384,92 L394,116 L380,120 Z" fill="url(#stripe)"/>
  <circle cx="362" cy="134" r="7" fill="#0b7a3f"/><circle cx="362" cy="134" r="4.3" fill="#ffcc29"/><circle cx="362" cy="134" r="2.2" fill="#1c4f9c"/>

  <!-- fuselagem afilada e pontiaguda -->
  <path d="M64,142 C80,128 110,120 150,120 C230,118 330,124 404,140
           C420,144 432,148 438,152 C428,156 404,162 366,166
           C300,174 200,178 140,172 C100,168 76,158 64,142 Z"
        fill="url(#body)" stroke="#0a1f44" stroke-width="1.8"/>

  <!-- canard (desenhado por cima da fuselagem, para não ficar escondido -
       marca registrada do Gripen: pequena aleta à frente da cabine) -->
  <path d="M96,130 L118,132 L108,106 L92,112 Z" fill="#8a97ac" stroke="#0a1f44" stroke-width="1.5"/>

  <!-- canopy única -->
  <path d="M164,124 C178,112 218,110 240,120 C244,127 242,133 232,134 C206,136 182,134 170,130 C166,128 162,127 164,124 Z"
        fill="#141b24" opacity="0.92" stroke="#3a4658" stroke-width="1.2"/>

  <!-- nariz fino em ponta -->
  <path d="M64,142 L38,146 L64,150 Z" fill="url(#body)" stroke="#0a1f44" stroke-width="1.5"/>
  <!-- bocal do motor -->
  <ellipse cx="440" cy="152" rx="6" ry="7" fill="#4b5566"/>

  <text x="240" y="234" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0a1f44">FAB 4100 · Saab F-39E Gripen</text>
  <text x="240" y="249" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#4b5566">Ilustração vetorial de perfil (ilustrativo)</text>
</svg>
