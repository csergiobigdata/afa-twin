<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260">
  <defs>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f6fb"/><stop offset="100%" stop-color="#dbe1ec"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a9270"/><stop offset="100%" stop-color="#a7ac8e"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcc29"/><stop offset="100%" stop-color="#0b7a3f"/>
    </linearGradient>
  </defs>
  <rect width="480" height="260" fill="url(#mat)"/>
  <rect x="7" y="7" width="466" height="246" rx="6" fill="none" stroke="#c7cedd" stroke-width="2.5"/>
  <ellipse cx="240" cy="200" rx="150" ry="9" fill="#0a1f44" opacity="0.14"/>

  <!-- asa alta com 4 motores turboélice -->
  <path d="M110,108 L378,108 L378,118 L110,118 Z" fill="#94997a" stroke="#0a1f44" stroke-width="1.8"/>
  <circle cx="150" cy="113" r="9" fill="#6c7258" stroke="#0a1f44" stroke-width="1.3"/><circle cx="150" cy="113" r="3" fill="#cfd3c2"/><circle cx="200" cy="113" r="9" fill="#6c7258" stroke="#0a1f44" stroke-width="1.3"/><circle cx="200" cy="113" r="3" fill="#cfd3c2"/><circle cx="288" cy="113" r="9" fill="#6c7258" stroke="#0a1f44" stroke-width="1.3"/><circle cx="288" cy="113" r="3" fill="#cfd3c2"/><circle cx="338" cy="113" r="9" fill="#6c7258" stroke="#0a1f44" stroke-width="1.3"/><circle cx="338" cy="113" r="3" fill="#cfd3c2"/>

  <!-- deriva alta -->
  <path d="M368,106 C378,80 398,70 412,74 L418,150 C400,140 380,128 368,106 Z" fill="#173b74" stroke="#0a1f44" stroke-width="1.8"/>
  <path d="M380,88 L394,84 L404,106 L390,110 Z" fill="url(#stripe)"/>
  <circle cx="374" cy="120" r="7" fill="#0b7a3f"/><circle cx="374" cy="120" r="4.3" fill="#ffcc29"/><circle cx="374" cy="120" r="2.2" fill="#1c4f9c"/>
  <!-- estabilizador horizontal -->
  <path d="M368,144 L414,150 L372,158 Z" fill="url(#body)" stroke="#0a1f44" stroke-width="1.8"/>

  <!-- fuselagem tubular, característica do Hercules -->
  <path d="M66,140 C86,122 128,112 180,110 C260,107 340,111 404,130
           C420,135 432,140 438,145 C430,150 410,157 378,162
           C310,173 190,178 134,171 C94,166 80,155 66,140 Z"
        fill="url(#body)" stroke="#0a1f44" stroke-width="1.8"/>

  <!-- cockpit -->
  <path d="M76,132 L108,123 L111,131 L80,140 Z" fill="#141b24" opacity="0.85"/>
  <!-- rampa traseira (linha característica) -->
  <line x1="392" y1="140" x2="430" y2="150" stroke="#0a1f44" stroke-width="1.4" opacity="0.6"/>

  <text x="240" y="234" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0a1f44">FAB 2464 · Lockheed C-130H Hercules</text>
  <text x="240" y="249" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#4b5566">Ilustração vetorial de perfil (ilustrativo)</text>
</svg>
